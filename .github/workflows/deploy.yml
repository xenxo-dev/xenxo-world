name: Desplegar

# Publica en Cloudflare cada vez que el CI pasa en main (o a mano desde la pestaña Actions).
# Configuración (una vez), en Settings → Secrets and variables → Actions:
#   Secretos:  CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID, TOKEN_SECRET, AGENT_KEYS (opcional),
#              DISTRICT_SIGNING_KEY (opcional: nodos de distritos, docs/guia/es/servidor.md),
#              N8N_WEBHOOK_URL y N8N_WEBHOOK_SECRET (opcionales: avisos de moderación, tools/n8n)
#   Variable:  WEB_DOMAIN (opcional, por defecto xenxo.io; el servidor va en api.<WEB_DOMAIN>)
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    # Solo despliega lo que está en main de ESTE repositorio y llegó por push (nunca el código de un
    # pull request, aunque su rama se llame main en un fork: workflow_run filtra por el nombre de la
    # rama, no por el repositorio). A mano, solo desde main.
    if: >-
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.head_branch == 'main' &&
       github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: ubuntu-latest
    # Los secretos NO van a nivel de trabajo: solo los pasos que despliegan los ven (así ningún
    # script de instalación o de compilación de una dependencia puede leerlos).
    env:
      WEB_DOMAIN: ${{ vars.WEB_DOMAIN || 'xenxo.io' }}
    steps:
      - name: ¿Está configurado?
        env:
          HAS_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN != '' }}
          HAS_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID != '' }}
          HAS_SECRET: ${{ secrets.TOKEN_SECRET != '' }}
        run: |
          if [ "$HAS_TOKEN" != "true" ] || [ "$HAS_ACCOUNT" != "true" ] || [ "$HAS_SECRET" != "true" ]; then
            echo "::notice::Faltan CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID o TOKEN_SECRET: no se despliega."
            echo "SKIP=1" >> "$GITHUB_ENV"
          fi
      - uses: actions/checkout@v4
        if: env.SKIP != '1'
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        if: env.SKIP != '1'
        with:
          node-version: 22
          cache: npm
      - if: env.SKIP != '1'
        run: npm ci

      - name: Subdominio workers.dev de la cuenta (lo exige Cloudflare; no publicamos nada en él)
        if: env.SKIP != '1'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          API="https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/subdomain"
          AUTH="Authorization: Bearer $CLOUDFLARE_API_TOKEN"
          current=$(curl -s -H "$AUTH" "$API" | python3 -c "import json,sys; d=json.load(sys.stdin); print((d.get('result') or {}).get('subdomain') or '')")
          if [ -n "$current" ]; then echo "ya existe: $current.workers.dev"; exit 0; fi
          for name in xenxo xenxo-io xenxo-world "xenxo-$(date +%s)"; do
            r=$(curl -s -X PUT -H "$AUTH" -H "Content-Type: application/json" --data "{\"subdomain\":\"$name\"}" "$API")
            if echo "$r" | python3 -c "import json,sys; sys.exit(0 if json.load(sys.stdin).get('success') else 1)"; then echo "creado: $name.workers.dev"; exit 0; fi
            echo "$name no disponible: $(echo "$r" | head -c 300)"
          done
          echo "::error::No se pudo crear el subdominio workers.dev: abre una vez Workers & Pages en el panel de Cloudflare."
          exit 1

      - name: Bucket de modelos en la UE (solo la primera vez)
        if: env.SKIP != '1'
        working-directory: apps/realtime
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler r2 bucket create xenxo-assets --jurisdiction eu || echo "ya existe"

      - name: Servidor de tiempo real → api.${{ env.WEB_DOMAIN }}
        if: env.SKIP != '1'
        working-directory: apps/realtime
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          TOKEN_SECRET: ${{ secrets.TOKEN_SECRET }}
          AGENT_KEYS: ${{ secrets.AGENT_KEYS }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          DISTRICT_SIGNING_KEY: ${{ secrets.DISTRICT_SIGNING_KEY }}
          N8N_WEBHOOK_URL: ${{ secrets.N8N_WEBHOOK_URL }}
          N8N_WEBHOOK_SECRET: ${{ secrets.N8N_WEBHOOK_SECRET }}
        run: |
          umask 077
          printf 'TOKEN_SECRET=%s\n' "$TOKEN_SECRET" > "$RUNNER_TEMP/secrets.env"
          if [ -n "$AGENT_KEYS" ]; then printf 'AGENT_KEYS=%s\n' "$AGENT_KEYS" >> "$RUNNER_TEMP/secrets.env"; fi
          # Entrar con Google (opcional): sin estas dos, el botón simplemente no aparece.
          if [ -n "$GOOGLE_CLIENT_SECRET" ]; then printf 'GOOGLE_CLIENT_SECRET=%s\n' "$GOOGLE_CLIENT_SECRET" >> "$RUNNER_TEMP/secrets.env"; fi
          # Nodos de la comunidad (opcional, src/nodes.ts): la clave privada con la que se firman pases y llamadas.
          if [ -n "$DISTRICT_SIGNING_KEY" ]; then printf "DISTRICT_SIGNING_KEY='%s'\n" "$DISTRICT_SIGNING_KEY" >> "$RUNNER_TEMP/secrets.env"; fi
          # Avisos de moderación a n8n (opcional, tools/n8n/README.md): sin los dos, no sale ningún aviso.
          if [ -n "$N8N_WEBHOOK_URL" ] && [ -n "$N8N_WEBHOOK_SECRET" ]; then
            printf 'N8N_WEBHOOK_URL=%s\nN8N_WEBHOOK_SECRET=%s\n' "$N8N_WEBHOOK_URL" "$N8N_WEBHOOK_SECRET" >> "$RUNNER_TEMP/secrets.env"
          fi
          npx wrangler deploy \
            --domain "api.$WEB_DOMAIN" \
            --var "RP_ID:$WEB_DOMAIN" \
            --var "ALLOWED_ORIGINS:https://$WEB_DOMAIN,https://www.$WEB_DOMAIN" \
            --var "FOUNDER_USER_ID:${{ vars.FOUNDER_USER_ID }}" \
            --var "GOOGLE_CLIENT_ID:${{ vars.GOOGLE_CLIENT_ID }}" \
            --secrets-file "$RUNNER_TEMP/secrets.env"
          rm -f "$RUNNER_TEMP/secrets.env"

      # Compilar, sin secretos a la vista.
      - name: Compilar la web, el MCP y los juegos de ejemplo
        if: env.SKIP != '1'
        run: |
          VITE_REALTIME_URL="https://api.$WEB_DOMAIN" npm run build -w @xenxo/web
          # La CSP de _headers nombra xenxo.io: en otro dominio, el suyo.
          [ "$WEB_DOMAIN" = "xenxo.io" ] || sed -i "s/\*\.xenxo\.io/*.$WEB_DOMAIN/g" apps/web/dist/_headers
          # El servidor MCP (un solo archivo) se sirve desde la web: xenxo.io/mcp/xenxo-mcp.mjs
          npm run build -w @xenxo/mcp
          mkdir -p apps/web/dist/mcp && cp packages/mcp/dist/xenxo-mcp.mjs apps/web/dist/mcp/
          for g in games/*/; do
            [ -f "$g/wrangler.toml" ] || continue
            cp packages/sdk/dist/index.js "$g/xenxo/xenxo-sdk.mjs"
          done

      - name: Web → ${{ env.WEB_DOMAIN }}
        if: env.SKIP != '1'
        working-directory: apps/web
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy --domain "$WEB_DOMAIN" --domain "www.$WEB_DOMAIN"

      # Juegos de ejemplo, cada uno en su propio dominio (no en xenxo.io: así se pueden incrustar).
      - name: Juegos de ejemplo → xenxo-<juego>.<subdominio>.workers.dev
        if: env.SKIP != '1'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          for g in games/*/; do
            [ -f "$g/wrangler.toml" ] || continue
            (cd "$g" && npx wrangler deploy)
          done

      - name: Comprobación
        if: env.SKIP != '1'
        run: |
          sleep 10
          curl -sf "https://api.$WEB_DOMAIN/health" && echo " ← servidor OK"
          curl -sfI "https://$WEB_DOMAIN/" | head -1
