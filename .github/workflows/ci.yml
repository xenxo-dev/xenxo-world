name: CI

on:
  push:
    branches: [main]
  pull_request: {}

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
      # El servidor de distritos (workerd en una máquina propia): que siga compilando.
      - run: npm run build:district-host
      # Y sus scripts (portátil y relevo del NAS): que al menos se lean bien.
      - run: for f in tools/district-host/*.sh tools/district-host/relevo/*.sh; do bash -n "$f"; done

      # El kit de distritos: compila y la plantilla de distrito pasa su propia comprobación.
      - name: Kit de distritos
        run: |
          npm run build -w @xenxo/district-kit
          node packages/create-xenxo/index.mjs "$RUNNER_TEMP/distrito-ci" --district --yes
          node packages/district-kit/dist/xenxo-district.mjs validate "$RUNNER_TEMP/distrito-ci" --lang es

      # La plantilla de juegos: crea uno 2D y otro 3D con el SDK empaquetado y los compila.
      - name: Juegos de ejemplo (ficha xenxo.json válida)
        run: |
          for f in games/*/xenxo.json; do
            npx tsx -e "import { GameManifest } from './packages/protocol/src/index.ts'; import { readFileSync } from 'node:fs'; GameManifest.parse(JSON.parse(readFileSync('$f', 'utf8'))); console.log('ok $f');"
          done

      - name: Plantilla create-xenxo
        run: |
          T=$(mktemp -d)
          npm pack -w @xenxo/sdk --pack-destination "$T" > /dev/null
          SDK=$(ls "$T"/xenxo-sdk-*.tgz)
          cd "$T"
          for v in "2d" "3d" "2d --multi" "3d --multi"; do
            d="juego-${v// /}"; d="${d//--/-}"
            node "$GITHUB_WORKSPACE/packages/create-xenxo/index.mjs" "$d" --$v --yes
            cd "$d"
            node -e 'const f=require("fs");const p=JSON.parse(f.readFileSync("package.json"));p.dependencies["@xenxo/sdk"]="file:"+process.argv[1];f.writeFileSync("package.json",JSON.stringify(p,null,2))' "$SDK"
            npm install --no-audit --no-fund
            npm run build
            # Con sala: que el Worker compile (sin desplegar nada).
            if [ -f sala/wrangler.toml ]; then npx wrangler deploy --dry-run --config sala/wrangler.toml --outdir /tmp/sala-$d; fi
            cd ..
          done

      # Conformidad del protocolo contra el servidor real en local (wrangler dev).
      - name: Arrancar el servidor de tiempo real
        working-directory: apps/realtime
        run: |
          KEY=ci-agent-key-$(openssl rand -hex 12)
          HASH=$(printf '%s' "$KEY" | sha256sum | cut -d' ' -f1)
          AKEY=ci-admin-key-$(openssl rand -hex 12)
          AHASH=$(printf '%s' "$AKEY" | sha256sum | cut -d' ' -f1)
          printf 'TOKEN_SECRET=%s\nAGENT_KEYS=ci:%s:build|upload,ciadmin:%s:build|upload|admin\nDO_JURISDICTION=\nRP_ID=localhost\n' "$(openssl rand -hex 32)" "$HASH" "$AHASH" > .dev.vars
          echo "XENXO_AGENT_KEY=$KEY" >> "$GITHUB_ENV"
          echo "XENXO_ADMIN_KEY=$AKEY" >> "$GITHUB_ENV"
          npx wrangler dev --port 8787 > wrangler.log 2>&1 &
          for i in $(seq 1 60); do curl -sf http://localhost:8787/health && break; sleep 1; done
      - run: npm run conformance
        env:
          XENXO_URL: http://localhost:8787
      - name: Servidor MCP de punta a punta
        run: npm run build -w @xenxo/mcp && npm run mcp-e2e -w @xenxo/headless
        env:
          XENXO_URL: http://localhost:8787
      - if: failure()
        run: cat apps/realtime/wrangler.log
