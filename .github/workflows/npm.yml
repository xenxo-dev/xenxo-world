name: Publicar en npm

# Publica a mano (Actions → «Publicar en npm» → Run workflow) uno de los paquetes MIT para
# creadores. Sube antes la versión en su package.json: npm no deja publicar dos veces la misma.
#
# npm ya no tiene tokens clásicos (los «Automation» dejaron de existir en noviembre de 2025). Ahora:
#
#  1. Una vez: crea la organización «xenxo» en npmjs.com (gratis para paquetes públicos; es la dueña
#     del ámbito @xenxo) con el doble factor activado.
#  2. La PRIMERA publicación de cada paquete necesita credencial, porque npm solo deja nombrar un
#     publicador de confianza a un paquete que ya existe. Dos formas:
#       a) aquí: crea en npmjs.com un token granular (lectura y escritura, «Bypass 2FA», caducidad
#          corta), guárdalo como secreto NPM_TOKEN y lanza este flujo para cada paquete; o
#       b) desde tu equipo: `npm login` y `npm publish -w <paquete> --access public`.
#  3. Después, en npmjs.com → cada paquete → Settings → Trusted Publisher → GitHub Actions:
#     organización xenxo-dev, repositorio xenxo-world, flujo npm.yml. (O con npm 11.15 o más nuevo:
#     `npm trust github <paquete> --file npm.yml --repo xenxo-dev/xenxo-world --allow-publish`.)
#     Borra el secreto NPM_TOKEN: desde entonces este flujo publica sin ningún token (OIDC) y npm
#     enseña que el paquete salió de este repositorio (procedencia).
#
# Al publicar los cuatro, pon NPM_PUBLISHED a true en apps/web/src/content.ts (la pestaña Crear deja
# de avisar del 404 y enseña el MCP con npx).
on:
  workflow_dispatch:
    inputs:
      paquete:
        description: Paquete
        required: true
        type: choice
        options:
          - "@xenxo/sdk"
          - create-xenxo
          - "@xenxo/district-kit"
          - "@xenxo/mcp"

permissions:
  contents: read
  id-token: write # publicador de confianza (OIDC) y procedencia

jobs:
  publish:
    # Solo desde main: nunca se publica el código de otra rama.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    env:
      # Solo se sabe si existe; el valor lo ve únicamente el paso que publica con él.
      HAS_TOKEN: ${{ secrets.NPM_TOKEN != '' }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          registry-url: https://registry.npmjs.org
      # La publicación de confianza pide npm 11.5.1 o más nuevo (Node 22 trae el 10).
      - run: npm install -g npm@latest
      - run: npm ci
      - run: npm run typecheck
      - name: Publicar (publicador de confianza, sin token)
        if: env.HAS_TOKEN != 'true'
        run: npm publish -w "${{ inputs.paquete }}" --access public --provenance
      - name: Publicar (primera vez, con el token granular)
        if: env.HAS_TOKEN == 'true'
        run: npm publish -w "${{ inputs.paquete }}" --access public --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
