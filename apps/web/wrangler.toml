# La web (panel + plaza 3D) como recursos estáticos de un Worker: sin servidor propio.
# El dominio lo pone el despliegue (.github/workflows/deploy.yml) con --domain.
name = "xenxo-web"
compatibility_date = "2026-10-01"
# Solo en el dominio propio: sin URL pública *.workers.dev ni URLs de vista previa.
workers_dev = false
preview_urls = false

[assets]
directory = "./dist"
not_found_handling = "single-page-application"
