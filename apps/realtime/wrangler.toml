name = "xenxo-realtime"
main = "src/index.ts"
compatibility_date = "2026-10-01"
# Solo en el dominio propio: sin URL pública *.workers.dev ni URLs de vista previa.
workers_dev = false
preview_urls = false

# Un Durable Object por chunk. SQLite es el único backend disponible en el plan gratuito.
[[durable_objects.bindings]]
name = "CHUNK"
class_name = "ChunkRoom"

# Cuentas, passkeys, proyectos y denuncias (un único objeto).
[[durable_objects.bindings]]
name = "DIRECTORY"
class_name = "Directory"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["ChunkRoom"]

[[migrations]]
tag = "v2"
new_sqlite_classes = ["Directory"]

# Modelos 3D direccionados por hash. Crea el bucket en la UE antes de desplegar:
#   npx wrangler r2 bucket create xenxo-assets --jurisdiction eu
[[r2_buckets]]
binding = "ASSETS"
bucket_name = "xenxo-assets"
jurisdiction = "eu"

# Modelos de la plaza generados por la forja (tools/forge), nombrados por su hash.
# Son recursos estáticos del propio Worker: no cuentan para el tamaño del script ni ocupan R2.
[assets]
directory = "./seed-assets"
binding = "STATIC"
# El Worker va primero en todo menos en /s/* (modelos y portadas del sistema): esos los sirve
# Cloudflare como estáticos, gratis y sin contar para las 100.000 peticiones al día del plan
# gratuito. Si alguno no está (p. ej. un despliegue a medias), lo atiende el Worker igual.
run_worker_first = ["/*", "!/s/*"]

[vars]
# Los datos de cada chunk se guardan y procesan solo en la UE (RGPD).
# Cambiarlo después de desplegar crea objetos nuevos y vacíos: decídelo antes del primer despliegue.
DO_JURISDICTION = "eu"
# Distritos en nodos de la comunidad (src/nodes.ts, docs/guia/es/servidor.md): qué nodo lleva cada
# distrito está en el registro (/mod/nodes). Solo hace falta el secreto DISTRICT_SIGNING_KEY
# (wrangler secret put); sin él, todo vive en Cloudflare y el cron no hace nada.
# Orígenes permitidos para /auth y /chunk/*/state (separados por comas).
ALLOWED_ORIGINS = "http://localhost:5173,https://xenxo.io,https://www.xenxo.io"
# Dominio de las passkeys. Debe coincidir con el dominio de la web (o ser su dominio padre).
RP_ID = "xenxo.io"
# Cuenta de GitHub cuyos repos públicos aparecen en el panel.
GITHUB_OWNER = "xenxo-dev"

# Secretos (no van aquí): `wrangler secret put TOKEN_SECRET` y `wrangler secret put AGENT_KEYS`.
# En local se leen de .dev.vars (ver .dev.vars.example).

# Límites por dirección de red para lo que se puede pedir sin cuenta (src/ratelimit.ts). Cuentan en
# el borde de Cloudflare y no guardan nada nuestro; si no estuvieran, hay un respaldo en memoria.
[[ratelimits]]
name = "RL_AUTH"
namespace_id = "1001"
  [ratelimits.simple]
  limit = 30
  period = 60

[[ratelimits]]
name = "RL_GUEST"
namespace_id = "1002"
  [ratelimits.simple]
  limit = 20
  period = 60

[[ratelimits]]
name = "RL_REPORT"
namespace_id = "1003"
  [ratelimits.simple]
  limit = 10
  period = 60

[[ratelimits]]
name = "RL_OIDC"
namespace_id = "1004"
  [ratelimits.simple]
  limit = 60
  period = 60

[[ratelimits]]
name = "RL_UPLOAD"
namespace_id = "1005"
  [ratelimits.simple]
  limit = 30
  period = 60

# La ronda de los nodos (src/nodes.ts): salud, copias de los distritos que cambian y relevo a
# Cloudflare si uno cae. Sin DISTRICT_SIGNING_KEY sale enseguida sin hacer nada.
[triggers]
crons = ["*/2 * * * *"]
